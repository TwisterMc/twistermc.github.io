<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thomas McMahon - TwisterMc - Minneapolis, Mn</title>
    <link rel="stylesheet" href="styles.css?v=1.0" />
    <link rel="canonical" href="https://twistermc.me/" />
    <link rel="icon" type="image/png" href="favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="favicon.png" />
  </head>
  <body>
    <div class="wrapper">
      <ul class="icons">
        <li class="icon">
          <a href="https://www.twistermc.com">
            <img
              src="icons/home.svg"
              alt="Home"
              width="44"
              aria-hidden="true"
            />
            <div>TwisterMc</div>
          </a>
        </li>
        <li class="icon">
          <a href="https://twistermc.me">
            <img
              src="icons/socials.svg"
              alt="Landing Page"
              width="44"
              aria-hidden="true"
            />
            <div>.me</div>
          </a>
        </li>
        <li class="icon">
          <a href="https://twistermc.github.io/project-tools/">
            <img
              src="icons/gantt.svg"
              class="icon-img-light"
              alt="Gantt Chart"
              width="44"
              aria-hidden="true"
            />
            <div>Gantt Chart</div>
          </a>
        </li>
        <li class="icon">
          <a href="https://twistermc.github.io/zip-to-kml/">
            <img
              src="icons/zip-kml.svg"
              class="icon-img-light icon-img-kml"
              alt="Zip to KML tool"
              width="44"
              aria-hidden="true"
            />
            <div>Zip to KML</div>
          </a>
        </li>
      </ul>
    </div>
  </body>
</html>
